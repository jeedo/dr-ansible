[project]
name = "dr-ansible"
version = "0.1.0"
description = "Find Ansible modules with missing RETURN docs and draft them from evidence"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "ansible-core>=2.21.4",
    "click>=8.5.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
dr-ansible = "dr_ansible.cli:main"

[project.optional-dependencies]
rich = [
    "rich>=15.0.0",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
    "types-pyyaml>=6.0.12.20260906",
]
