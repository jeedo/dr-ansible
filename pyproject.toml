[project]
name = "dr-ansible"
version = "0.1.0"
description = "Find Ansible modules with missing RETURN docs and draft them from evidence"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "ansible-core>=2.21.4",
    "click>=8.5.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
dr-ansible = "dr_ansible.cli:main"

[project.optional-dependencies]
rich = [
    "rich>=15.0.0",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "rich>=15.0.0",
    "ruff>=0.16.9",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
target-version = "py313"
# Fixtures are deliberately odd module code (dynamic keys, raise-on-import) that
# dr-ansible analyses; they are test data, not project code.
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
    "PT",  # flake8-pytest-style
]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]
exclude = ["^tests/fixtures/"]

[[tool.mypy.overrides]]
# ansible-core ships no type information (no py.typed).
module = ["ansible.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "-m", "not acceptance and not runtime",
]
xfail_strict = true
markers = [
    "acceptance: needs a pinned ansible-core devel checkout (run with -m acceptance)",
    "runtime: runs ansible-test integration in Docker (run with -m runtime)",
]
