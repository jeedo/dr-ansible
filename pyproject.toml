[project]
name = "dr-ansible"
version = "0.2.0"
description = "Find Ansible modules with missing RETURN docs and draft them from evidence"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.13"
keywords = [
    "ansible",
    "ansible-core",
    "documentation",
    "return-values",
    "modules",
    "validate-modules",
    "static-analysis",
]
# No License :: classifier: the license expression above replaces it (PEP 639).
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Framework :: Ansible",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Topic :: Documentation",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
dependencies = [
    "ansible-core>=2.21.4",
    "click>=8.5.0",
    "pyyaml>=6.0.3",
]

[project.urls]
Homepage = "https://github.com/jeedo/dr-ansible"
Repository = "https://github.com/jeedo/dr-ansible"
Issues = "https://github.com/jeedo/dr-ansible/issues"

[project.scripts]
dr-ansible = "dr_ansible.cli:main"

[project.optional-dependencies]
rich = [
    "rich>=15.0.0",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "rich>=15.0.0",
    "ruff>=0.16.9",
    "types-jsonschema>=4.26.0.20260518",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
target-version = "py313"
# Fixtures are deliberately odd module code (dynamic keys, raise-on-import) that
# dr-ansible analyses; they are test data, not project code.
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
    "PT",  # flake8-pytest-style
]

[tool.ruff.lint.per-file-ignores]
# Ansible plugins declare DOCUMENTATION before their imports.
"src/dr_ansible/mining/callback/dr_ansible_recorder.py" = ["E402"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]
exclude = ["^tests/fixtures/"]

[[tool.mypy.overrides]]
# ansible-core ships no type information (no py.typed).
module = ["ansible.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "-m", "not acceptance and not runtime",
]
xfail_strict = true
markers = [
    "acceptance: needs a pinned ansible-core devel checkout (run with -m acceptance)",
    "runtime: runs ansible-test integration in Docker (run with -m runtime)",
]
