name: Runtime

# `--run` end to end (AC-11, AC-12): real ansible-test integration runs, both
# --local and in ansible-test's default container. Too slow for every PR, so
# on demand and weekly.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Cache the ansible-core checkout
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/dr-ansible
          key: ansible-core-${{ hashFiles('tests/acceptance/checkout.py') }}

      - name: Fetch the ansible-core checkout
        run: uv run python -m tests.acceptance.checkout

      - name: Runtime tests
        env:
          # GitHub's runners have Docker: fail rather than skip without it.
          DR_ANSIBLE_REQUIRE_DOCKER: "1"
        run: uv run pytest -m runtime -rs
