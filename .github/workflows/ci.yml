name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only token: CI never writes to the repository.
permissions:
  contents: read

# A newer push to the same PR or branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs; Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          enable-cache: true

      - name: Set up Python
        # No version argument: uv reads .python-version (3.13).
        run: uv python install

      - name: Install dependencies
        # --locked fails if uv.lock is out of date with pyproject.toml.
        run: uv sync --locked --group dev

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        # Strict, over src and tests (configured in pyproject.toml).
        run: uv run mypy

      - name: Test
        # Acceptance and runtime suites are deselected by default (pyproject.toml).
        run: uv run pytest

      - name: Check docs
        run: uv run python scripts/check_docs.py
